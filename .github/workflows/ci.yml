name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# GitHub-hosted runners only (the repository is public: no fork code runs on Livia runners). PHP tools run in the
# official Docker images, the integration tests in wp-env.
jobs:
  php:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install PHP tools
        run: docker run --rm -v "$PWD:/app" -w /app composer:2 composer install --no-interaction --no-progress
      - name: PHPCS (WordPress Coding Standards, PHP 7.4+ compatibility)
        run: docker run --rm -v "$PWD:/app" -w /app composer:2 vendor/bin/phpcs
      - name: Syntax under PHP 7.4
        run: >
          docker run --rm -v "$PWD:/app" -w /app php:7.4-cli
          sh -c 'find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*" -print0 | xargs -0 -n1 php -l'
      - name: Unit tests, PHP 7.4
        run: docker run --rm -v "$PWD:/app" -w /app php:7.4-cli vendor/bin/phpunit -c phpunit-unit.xml.dist
      - name: Unit tests, PHP 8.3
        run: docker run --rm -v "$PWD:/app" -w /app php:8.3-cli vendor/bin/phpunit -c phpunit-unit.xml.dist

  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Elementor of .wp-env.json needs a newer WordPress: this entry runs without it.
          - core: WordPress/WordPress#6.5-branch
            php: '7.4'
            elementor: false
          - core: WordPress/WordPress#7.1-branch
            php: '8.3'
            elementor: true
    name: integration (WordPress ${{ matrix.core }}, PHP ${{ matrix.php }})
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Node.js 24.22.1
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Choose WordPress and PHP
        run: |
          if [ "${{ matrix.elementor }}" = "true" ]; then plugins=''; else plugins=', "plugins": [ "." ]'; fi
          echo "{ \"core\": \"${{ matrix.core }}\", \"phpVersion\": \"${{ matrix.php }}\"$plugins }" > .wp-env.override.json
      - name: Start wp-env
        run: npx wp-env start --auto-port
      - name: Install PHP tools
        run: npx wp-env run tests-cli --env-cwd="wp-content/plugins/$(basename "$PWD")" composer install --no-interaction --no-progress
      - name: Integration tests
        run: npx wp-env run tests-cli --env-cwd="wp-content/plugins/$(basename "$PWD")" vendor/bin/phpunit -c phpunit-integration.xml.dist
      - name: Integration tests, multisite
        run: npx wp-env run tests-cli --env-cwd="wp-content/plugins/$(basename "$PWD")" env WP_MULTISITE=1 vendor/bin/phpunit -c phpunit-integration.xml.dist
      - name: Integration tests, Elementor
        if: matrix.elementor
        run: npx wp-env run tests-cli --env-cwd="wp-content/plugins/$(basename "$PWD")" env LIVIA_TEST_ELEMENTOR=1 vendor/bin/phpunit -c phpunit-integration.xml.dist
      - name: Stop wp-env
        if: always()
        run: npx wp-env stop

  zip:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Node.js 24.22.1
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: JavaScript tests
        run: npm run test:js
      - name: Build the zip
        run: bin/build-zip.sh
